<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Billing / Checkout - Amber &amp; Grain</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;family=Literata:wght@600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-secondary-fixed": "#25190e",
                        "outline": "#857466",
                        "primary": "#6a3c00",
                        "surface-bright": "#fff8f5",
                        "on-primary": "#ffffff",
                        "on-primary-fixed": "#2d1600",
                        "on-background": "#211a15",
                        "on-tertiary": "#ffffff",
                        "on-primary-fixed-variant": "#6a3b00",
                        "inverse-surface": "#372f29",
                        "on-secondary-container": "#705f51",
                        "surface-container-high": "#f4e6dc",
                        "secondary-fixed-dim": "#d8c3b1",
                        "primary-fixed": "#ffdcbf",
                        "secondary": "#6c5b4d",
                        "tertiary-fixed": "#cbe6ff",
                        "on-tertiary-fixed": "#001e30",
                        "surface-container": "#f9ebe2",
                        "primary-container": "#8c5000",
                        "on-tertiary-container": "#b7ddff",
                        "on-secondary": "#ffffff",
                        "secondary-container": "#f2dcca",
                        "surface-container-low": "#fff1e8",
                        "error-container": "#ffdad6",
                        "on-surface-variant": "#524438",
                        "surface-container-highest": "#eee0d6",
                        "error": "#ba1a1a",
                        "secondary-fixed": "#f5decd",
                        "on-error-container": "#93000a",
                        "on-surface": "#211a15",
                        "background": "#fff8f5",
                        "surface-dim": "#e5d8ce",
                        "surface-container-lowest": "#ffffff",
                        "surface": "#fff8f5",
                        "outline-variant": "#d7c3b3",
                        "surface-tint": "#8c5000",
                        "tertiary-fixed-dim": "#8fcdff",
                        "on-tertiary-fixed-variant": "#004b71",
                        "inverse-primary": "#ffb873",
                        "tertiary": "#004b71",
                        "inverse-on-surface": "#fceee4",
                        "on-secondary-fixed-variant": "#534437",
                        "primary-fixed-dim": "#ffb873",
                        "on-primary-container": "#ffd0a6",
                        "on-error": "#ffffff",
                        "tertiary-container": "#006495",
                        "surface-variant": "#eee0d6"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "md": "16px",
                        "container-max": "1440px",
                        "xs": "8px",
                        "lg": "24px",
                        "xxl": "48px",
                        "base": "4px",
                        "sm": "12px",
                        "gutter": "24px",
                        "xl": "32px"
                    },
                    "fontFamily": {
                        "headline-lg": ["Literata"],
                        "label-md": ["Plus Jakarta Sans"],
                        "display-lg": ["Literata"],
                        "body-md": ["Plus Jakarta Sans"],
                        "headline-md": ["Literata"],
                        "body-lg": ["Plus Jakarta Sans"],
                        "title-lg": ["Plus Jakarta Sans"],
                        "data-mono": ["Plus Jakarta Sans"]
                    },
                    "fontSize": {
                        "headline-lg": ["32px", { "lineHeight": "40px", "fontWeight": "600" }],
                        "label-md": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600" }],
                        "display-lg": ["48px", { "lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "headline-md": ["24px", { "lineHeight": "32px", "fontWeight": "600" }],
                        "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "title-lg": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "data-mono": ["14px", { "lineHeight": "20px", "fontWeight": "500" }]
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-background text-on-background font-body-md min-h-screen flex">
<!-- Canvas -->
<main class="flex-1 ml-0 md:ml-[280px] mt-20 p-xl flex justify-center items-center h-[calc(100vh-80px)]">
<!-- Billing/Checkout layout does not use global shell/nav based on instructions -->
<div class="max-w-[1000px] w-full grid grid-cols-1 md:grid-cols-2 gap-xl">
<!-- Left Column: Itemized Receipt -->
<section class="bg-surface-container-lowest rounded-[16px] shadow-[0px_4px_20px_rgba(83,68,55,0.06)] p-lg flex flex-col h-[600px]">
<div class="flex justify-between items-center mb-md pb-xs border-b border-outline-variant">
<h2 class="font-headline-md text-headline-md text-primary">Table 7 Checkout</h2>
<span class="font-data-mono text-data-mono text-on-surface-variant">#CHK-8492</span>
</div>
<div class="flex-1 overflow-y-auto pr-xs">
<div class="space-y-sm mb-lg">
<h3 class="font-label-md text-label-md text-on-surface-variant uppercase">Round 1</h3>
<div class="flex justify-between font-body-md text-body-md text-on-surface">
<span>2x House Old Fashioned</span>
<span>$28.00</span>
</div>
<div class="flex justify-between font-body-md text-body-md text-on-surface">
<span>1x Charcuterie Board</span>
<span>$24.00</span>
</div>
</div>
</div>
<div class="mt-auto pt-md border-t border-outline-variant space-y-sm">
<div class="flex justify-between font-body-md text-body-md text-on-surface-variant">
<span>Subtotal</span>
<span>$52.00</span>
</div>
<div class="flex justify-between font-body-md text-body-md text-on-surface-variant">
<span>Tax (8.5%)</span>
<span>$4.42</span>
</div>
<div class="flex justify-between font-body-md text-body-md text-on-surface-variant">
<span>Gratuity (Suggested 20%)</span>
<span>$10.40</span>
</div>
<div class="flex justify-between font-title-lg text-title-lg text-primary pt-xs">
<span>Total</span>
<span>$66.82</span>
</div>
</div>
</section>
<!-- Right Column: Payment Controls -->
<section class="bg-surface-container-lowest rounded-[16px] shadow-[0px_4px_20px_rgba(83,68,55,0.06)] p-lg flex flex-col h-[600px]">
<h3 class="font-label-md text-label-md text-on-surface-variant uppercase mb-md">Payment Method</h3>
<div class="grid grid-cols-3 gap-sm mb-lg">
<button class="py-sm px-xs border border-primary rounded-lg text-primary font-label-md text-label-md bg-primary-container/10 transition-colors">Cash</button>
<button class="py-sm px-xs border border-outline-variant rounded-lg text-on-surface-variant font-label-md text-label-md hover:bg-surface-container-low transition-colors">Card</button>
<button class="py-sm px-xs border border-outline-variant rounded-lg text-on-surface-variant font-label-md text-label-md hover:bg-surface-container-low transition-colors">Split</button>
</div>
<div class="mb-md">
<label class="font-label-md text-label-md text-on-surface-variant mb-base block">Amount Tendered</label>
<div class="relative">
<span class="absolute left-md top-1/2 -translate-y-1/2 font-headline-md text-headline-md text-on-surface-variant">$</span>
<input class="w-full pl-xl py-sm bg-surface rounded-lg border border-outline-variant font-headline-md text-headline-md text-on-surface focus:outline-none focus:border-primary text-right pr-md" readonly="" type="text" value="66.82"/>
</div>
</div>
<!-- Number Pad -->
<div class="grid grid-cols-3 gap-xs mb-auto">
<button class="py-md bg-surface-container-low rounded-lg font-headline-md text-headline-md text-on-surface hover:bg-surface-variant transition-colors">1</button>
<button class="py-md bg-surface-container-low rounded-lg font-headline-md text-headline-md text-on-surface hover:bg-surface-variant transition-colors">2</button>
<button class="py-md bg-surface-container-low rounded-lg font-headline-md text-headline-md text-on-surface hover:bg-surface-variant transition-colors">3</button>
<button class="py-md bg-surface-container-low rounded-lg font-headline-md text-headline-md text-on-surface hover:bg-surface-variant transition-colors">4</button>
<button class="py-md bg-surface-container-low rounded-lg font-headline-md text-headline-md text-on-surface hover:bg-surface-variant transition-colors">5</button>
<button class="py-md bg-surface-container-low rounded-lg font-headline-md text-headline-md text-on-surface hover:bg-surface-variant transition-colors">6</button>
<button class="py-md bg-surface-container-low rounded-lg font-headline-md text-headline-md text-on-surface hover:bg-surface-variant transition-colors">7</button>
<button class="py-md bg-surface-container-low rounded-lg font-headline-md text-headline-md text-on-surface hover:bg-surface-variant transition-colors">8</button>
<button class="py-md bg-surface-container-low rounded-lg font-headline-md text-headline-md text-on-surface hover:bg-surface-variant transition-colors">9</button>
<button class="py-md bg-surface-container-low rounded-lg font-headline-md text-headline-md text-on-surface hover:bg-surface-variant transition-colors">.</button>
<button class="py-md bg-surface-container-low rounded-lg font-headline-md text-headline-md text-on-surface hover:bg-surface-variant transition-colors">0</button>
<button class="py-md bg-surface-container-low rounded-lg flex items-center justify-center text-on-surface hover:bg-surface-variant transition-colors">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">backspace</span>
</button>
</div>
<button class="w-full mt-lg py-md bg-[#2e7d32] hover:bg-[#1b5e20] text-on-primary rounded-full font-label-md text-label-md uppercase tracking-wider transition-colors shadow-sm flex justify-center items-center gap-xs">
<span class="material-symbols-outlined text-[18px]">check_circle</span>
                    Mark Paid &amp; Complete Session
                </button>
</section>
</div>
</main>
</body></html>
