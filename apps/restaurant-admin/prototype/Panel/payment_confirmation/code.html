<style>
        /* Custom animations for completion state */
        @keyframes scaleIn {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        @keyframes slideUpFade {
            0% { transform: translateY(20px); opacity: 0; }
            100% { transform: translateY(0); opacity: 1; }
        }
        
        .animate-scale-in {
            animation: scaleIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        .animate-slide-up-1 {
            animation: slideUpFade 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.1s forwards;
            opacity: 0;
        }
        .animate-slide-up-2 {
            animation: slideUpFade 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.2s forwards;
            opacity: 0;
        }
        .animate-slide-up-3 {
            animation: slideUpFade 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.3s forwards;
            opacity: 0;
        }
    </style>
</head>
<body class="bg-surface-bright text-on-background font-body-md antialiased h-screen w-full flex items-center justify-center overflow-hidden">
<!-- Main Canvas: Fullscreen Success State -->
<main class="w-full max-w-lg px-xl flex flex-col items-center text-center">
<!-- Animated Success Icon Area -->
<div class="relative flex items-center justify-center mb-xl animate-scale-in">
<!-- Decorative background ring -->
<div class="absolute inset-0 bg-primary-container opacity-10 rounded-full scale-150"></div>
<div class="absolute inset-0 bg-primary-container opacity-20 rounded-full scale-110"></div>
<!-- Core Icon (Using brand primary to align with strict theme constraints while denoting importance) -->
<span class="material-symbols-outlined text-display-lg text-primary relative z-10" style="font-variation-settings: 'FILL' 1; font-size: 80px;">
                task_alt
            </span>
</div>
<!-- Typography Context -->
<h1 class="font-headline-lg text-headline-lg text-on-background mb-lg animate-slide-up-1 tracking-tight">
            Session Completed
        </h1>
<!-- Premium Data Card (Replacing simple subtext with structured "Cockpit" data) -->
<div class="bg-surface rounded-xl border border-outline-variant shadow-[0px_4px_20px_rgba(83,68,55,0.06)] w-full p-lg mb-xl animate-slide-up-2 flex flex-col gap-sm text-left">
<div class="flex justify-between items-center border-b border-outline-variant pb-sm">
<span class="font-label-md text-label-md text-on-surface-variant uppercase">Status Update</span>
<span class="inline-flex items-center gap-xs bg-surface-container-high px-sm py-base rounded-full">
<span class="w-2 h-2 rounded-full bg-primary"></span>
<span class="font-label-md text-label-md text-on-background">Table 7 Free</span>
</span>
</div>
<div class="flex justify-between items-center pt-xs">
<span class="font-body-md text-body-md text-on-surface-variant">Total Paid</span>
<span class="font-data-mono text-data-mono text-on-background text-lg">$68.40</span>
</div>
<div class="flex justify-between items-center">
<span class="font-body-md text-body-md text-on-surface-variant">Payment Method</span>
<span class="font-body-md text-body-md text-on-background flex items-center gap-xs">
<span class="material-symbols-outlined text-[16px]">credit_card</span>
                    Visa
                </span>
</div>
</div>
<!-- Action Area -->
<div class="flex flex-col sm:flex-row gap-md w-full justify-center animate-slide-up-3">
<button class="bg-primary text-on-primary font-label-md text-label-md px-xl py-sm rounded-full shadow-sm hover:bg-on-primary-fixed transition-colors duration-200 flex-1 sm:flex-none">
                Back to Tables
            </button>
<button class="bg-transparent border border-primary text-primary font-label-md text-label-md px-xl py-sm rounded-full hover:bg-primary/5 transition-colors duration-200 flex-1 sm:flex-none">
                Print Receipt
            </button>
</div>
</main>
