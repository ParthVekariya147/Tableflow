<body class="bg-background text-on-background font-body-md text-body-md min-h-screen flex items-center justify-center relative overflow-hidden">
<!-- Ambient Background Accent -->
<div class="absolute inset-0 pointer-events-none overflow-hidden">
<div class="absolute -top-1/4 -right-1/4 w-[800px] h-[800px] bg-primary-container/5 rounded-full blur-[100px]"></div>
<div class="absolute -bottom-1/4 -left-1/4 w-[600px] h-[600px] bg-secondary-container/10 rounded-full blur-[80px]"></div>
</div>
<!-- Login Card -->
<div class="w-full max-w-[420px] bg-surface-container-lowest rounded-[16px] custom-shadow p-xl relative z-10 mx-md">
<!-- Logo -->
<div class="flex justify-center mb-lg">
<img alt="Brand Logo" class="w-[88px] h-[88px] object-contain rounded-md" src="https://lh3.googleusercontent.com/aida/AP1WRLvGR8Bf4BrOL-v4HOACpTjdQIxHFMNWzgQioSsXjwpcg6YyUGlJyKYA7yXhsQV5Bb6sUrX9AwvBNS_XEVuTw3syMA9-i4vcWgHHNjxdxOCUNgG084LMP4Lcj4MG2zArfFoi572LQPx49i5Se-YjbXUpLXlhmFCRtKO9v1JIPqL6ifyfBwSXLEtQTzffuasbDskldfBZfAymLyXzH2tMKhTtCV4n9XHtSRI2kGr13VQuzYXWEPTnJHD9QZM"/>
</div>
<!-- Header -->
<div class="text-center mb-xl">
<h1 class="font-headline-md text-headline-md text-primary pb-base border-b border-surface-variant inline-block">Manager Cockpit</h1>
<p class="font-body-md text-body-md text-on-surface-variant mt-sm">Sign in to access restaurant controls</p>
</div>
<!-- Form -->
<form class="space-y-lg">
<!-- Username/Email -->
<div>
<label class="block font-label-md text-label-md text-on-surface mb-base uppercase tracking-wider" for="username">Username / Email</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-sm top-1/2 -translate-y-1/2 text-on-surface-variant pointer-events-none" data-icon="person">person</span>
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded-lg pl-10 pr-sm py-sm text-on-surface font-body-md text-body-md placeholder:text-outline-variant focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors" id="username" name="username" placeholder="manager@amberandgrain.com" type="text"/>
</div>
</div>
<!-- Password -->
<div>
<label class="block font-label-md text-label-md text-on-surface mb-base uppercase tracking-wider" for="password">Password</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-sm top-1/2 -translate-y-1/2 text-on-surface-variant pointer-events-none" data-icon="lock">lock</span>
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded-lg pl-10 pr-sm py-sm text-on-surface font-body-md text-body-md placeholder:text-outline-variant focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors" id="password" name="password" placeholder="••••••••" type="password"/>
</div>
</div>
<!-- CTA -->
<button class="w-full bg-primary text-on-primary rounded-full py-sm px-lg font-label-md text-label-md uppercase tracking-wider hover:bg-primary-fixed-variant hover:text-on-primary-fixed transition-colors mt-xs flex justify-center items-center gap-xs" type="button">
                Sign In
                <span class="material-symbols-outlined text-[18px]" data-icon="arrow_forward">arrow_forward</span>
</button>
</form>
<!-- Footer -->
<div class="flex items-center justify-between mt-xl pt-lg border-t border-outline-variant/30">
<a class="font-label-md text-label-md text-on-surface-variant hover:text-primary transition-colors" href="#">Forgot Password?</a>
<span class="font-data-mono text-data-mono text-[12px] text-outline">System v1.2</span>
</div>
</div>
</body></html>
