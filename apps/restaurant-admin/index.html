<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- No viewport-fit=cover: with the status bar style below, iOS insets the
         web view itself, so the fixed top bar never slides under the notch. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TableFlow</title>

    <!-- Installable web app (see public/manifest.webmanifest + public/sw.js). -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#8c5000" />
    <meta name="description" content="Run your floor from any device — tables, orders, kitchen display, billing and quick sale." />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <!-- iOS ignores the manifest: it needs these to add a proper home-screen app. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="TableFlow" />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Literata:opsz,wght@7..72,500;7..72,600;7..72,700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
