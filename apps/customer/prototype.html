const ALL_ITEMS = Object.values(MENU).flat();
const CATEGORIES = ["All", ...Object.keys(MENU)];

let orderIdCounter = 1000;
const genId = () => (++orderIdCounter).toString();

// ─── GLOBAL STATE (lifted up) ─────────────────────────────────────────────────
// myOrder = items held but NOT yet sent (basket)
// sentRounds = [{id, items, sentAt, status}] — sent to kitchen
// toast helpers
// screen stack navigation

const App = () => {
  const [screen, setScreen]         = useState("splash");   // splash|welcome|menu|myorder|status|receipt
  const [prevScreen, setPrevScreen] = useState(null);
  const [category, setCategory]     = useState("All");

  // My Order (basket — not yet sent)
  const [myOrder, setMyOrder]       = useState([]);  // [{item, qty, note}]

  // Sent rounds (committed to kitchen)
  const [rounds, setRounds]         = useState([]);  // [{id, label, items, sentAt, status}]

  // Toast
  const [toast, setToast]           = useState(null);
  const toastTimer                  = useRef(null);

  // Bill requested
  const [billRequested, setBillRequested] = useState(false);

  const showToast = useCallback((msg) => {
    clearTimeout(toastTimer.current);
    setToast(msg);
    toastTimer.current = setTimeout(() => setToast(null), 2200);
  }, []);

  const navigate = (to, from) => {
    setPrevScreen(from || screen);
    setScreen(to);
    window.scrollTo(0,0);
  };

  // ── Ordering logic ──────────────────────────────────────────────────────────

  const myOrderCount = myOrder.reduce((s,l) => s + l.qty, 0);
  const myOrderTotal = myOrder.reduce((s,l) => s + l.qty * l.item.price, 0);

  const addToMyOrder = (item) => {
    setMyOrder(prev => {
      const existing = prev.find(l => l.item.id === item.id);
      if (existing) return prev.map(l => l.item.id === item.id ? {...l, qty: l.qty+1} : l);
      return [...prev, { item, qty:1, note:"" }];
    });
    showToast(`Added to My Order`);
  };

  const updateQty = (itemId, delta) => {
    setMyOrder(prev => {
      const updated = prev.map(l => l.item.id === itemId ? {...l, qty: Math.max(0, l.qty+delta)} : l);
      return updated.filter(l => l.qty > 0);
    });
  };

  const updateNote = (itemId, note) => {
    setMyOrder(prev => prev.map(l => l.item.id === itemId ? {...l, note} : l));
  };

  const removeFromMyOrder = (itemId) => {
    setMyOrder(prev => prev.filter(l => l.item.id !== itemId));
  };

  // "Bring it" — send a single item immediately to kitchen
  const bringIt = (item) => {
    const round = {
      id: genId(),
      label: `Sent ${new Date().toLocaleTimeString('en-AU', {hour:'2-digit', minute:'2-digit'})}`,
      items: [{ item, qty:1, note:"" }],
      sentAt: new Date(),
      status: "Placed"
    };
    setRounds(prev => [...prev, round]);
    showToast(`${item.name} sent to kitchen ✓`);
    // Start auto-advancing after short delay (simulate kitchen)
    startStatusSim(round.id);
  };

  // "Bring these" — send everything in My Order
  const bringThese = () => {
    if (myOrder.length === 0) return;
    const round = {
      id: genId(),
      label: `Round ${rounds.length + 1} · ${new Date().toLocaleTimeString('en-AU', {hour:'2-digit', minute:'2-digit'})}`,
      items: [...myOrder],
      sentAt: new Date(),
      status: "Placed"
    };
    setRounds(prev => [...prev, round]);
    setMyOrder([]);
    showToast(`Your order is on its way ✓`);
    startStatusSim(round.id);
    navigate("status");
  };

  // Simulate kitchen status progression
  const startStatusSim = (roundId) => {
    setTimeout(() => {
      setRounds(prev => prev.map(r => r.id === roundId ? {...r, status:"Preparing"} : r));
    }, 6000);
    setTimeout(() => {
      setRounds(prev => prev.map(r => r.id === roundId ? {...r, status:"Served"} : r));
    }, 14000);
  };

  const sessionTotal = rounds.reduce((s, r) => s + r.items.reduce((rs,l) => rs + l.qty * l.item.price, 0), 0);
  const activeRounds = rounds.filter(r => r.status !== "Served");
  const pendingCount = rounds.reduce((s,r) => r.status !== "Served" ? s + r.items.reduce((rs,l) => rs+l.qty,0) : s, 0);

  const props = {
    navigate, category, setCategory,
    myOrder, myOrderCount, myOrderTotal,
    addToMyOrder, updateQty, updateNote, removeFromMyOrder,
    bringIt, bringThese,
    rounds, sessionTotal, activeRounds, pendingCount,
    billRequested, setBillRequested,
    showToast
  };

  return (
    <div className="relative w-full min-h-screen max-w-md mx-auto overflow-hidden" style={{boxShadow:"0 0 60px rgba(0,0,0,0.06)"}}>
      {screen === "splash"   && <SplashScreen   {...props} key="splash" />}
      {screen === "welcome"  && <WelcomeScreen  {...props} key="welcome" />}
      {screen === "menu"     && <MenuScreen     {...props} key="menu" />}
      {screen === "myorder"  && <MyOrderScreen  {...props} key="myorder" />}
      {screen === "status"   && <StatusScreen   {...props} key="status" />}
      {screen === "receipt"  && <ReceiptScreen  {...props} key="receipt" />}

      {/* Bottom nav — shown on all except splash */}
      {screen !== "splash" && <BottomNav screen={screen} navigate={navigate} myOrderCount={myOrderCount} pendingCount={pendingCount} />}

      {/* Toast */}
      {toast && <div className="toast" key={toast}>{toast}</div>}
    </div>
  );
};

// ─── BOTTOM NAV ──────────────────────────────────────────────────────────────
const BottomNav = ({ screen, navigate, myOrderCount, pendingCount }) => {
  const tabs = [
    { id:"menu",    label:"Menu",      icon:"restaurant_menu" },
    { id:"myorder", label:"My Order",  icon:"shopping_bag",   badge: myOrderCount },
    { id:"status",  label:"Status",    icon:"auto_timer",     badge: pendingCount },
    { id:"receipt", label:"Bill",      icon:"receipt_long" },
  ];
  return (
    <nav className="fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-md z-50 bg-surface/90 backdrop-blur-xl shadow-[0px_-1px_0px_rgba(0,0,0,0.06)] rounded-t-3xl">
      <div className="flex justify-around items-center px-4 py-3">
        {tabs.map(tab => {
          const active = screen === tab.id;
          return (
            <button key={tab.id} onClick={() => navigate(tab.id)} className={`flex flex-col items-center gap-0.5 relative transition-all duration-200 ${active ? "text-primary" : "text-on-surface-variant"}`}>
              <div className="relative">
                <span className={`ms ${active ? "ms-fill" : ""}`} style={{fontSize:24}}>{tab.icon}</span>
                {tab.badge > 0 && (
                  <span className="absolute -top-1 -right-1.5 bg-primary text-on-primary text-[10px] font-bold w-4 h-4 rounded-full flex items-center justify-center pop-in">{tab.badge}</span>
                )}
              </div>
              <span className={`text-[11px] font-semibold leading-none ${active ? "" : "font-medium"}`}>{tab.label}</span>
            </button>
          );
        })}
      </div>
    </nav>
  );
};

      </button>
      <h1 className="font-serif text-[18px] font-semibold text-primary">{title}</h1>
      {right || <div className="w-9 h-9" />}

);

  const [reserved, setReserved] = useState(false);

            )}
          </div>
        </div>
      )}
    </div>
  );
};

const RoundCard = ({ round, isLatest }) => {
  const stepIdx = STATUS_STEPS.indexOf(round.status);

  return (
    <div className={`bg-surface-container-lowest rounded-2xl shadow-sm overflow-hidden ${isLatest ? "" : "opacity-80"}`}>
      <div className="flex items-center justify-between px-4 pt-3 pb-2 border-b border-surface-container">
        <span className="text-xs font-bold uppercase tracking-widest text-on-surface-variant">{round.label}</span>
        <StatusPill status={round.status} />
      </div>

      {/* Items */}
      <div className="px-4 py-3 border-b border-surface-container space-y-1.5">
        {round.items.map((line, i) => (
          <div key={i} className="flex justify-between text-sm">
            <span className="text-on-surface">{line.qty}× {line.item.name}{line.note && <span className="text-on-surface-variant italic text-xs ml-1">({line.note})</span>}</span>
            <span className="font-semibold">${(line.qty * line.item.price).toFixed(2)}</span>
          </div>
        ))}
      </div>

      {/* Status tracker */}
      <div className="px-4 py-3">
        <div className="flex items-center gap-0">
          {STATUS_STEPS.map((step, i) => {
            const done    = i < stepIdx;
            const current = i === stepIdx;
            const future  = i > stepIdx;
            return (
              <React.Fragment key={step}>
                <div className={`flex flex-col items-center gap-1 flex-none`}>
                  <div className={`w-9 h-9 rounded-full flex items-center justify-center relative ${done ? "bg-primary" : current ? "bg-primary-container" : "bg-surface-container"}`}>
                    {current && <div className="pulse-ring" />}
                    <span className={`ms ms-sm relative z-10 ${done ? "ms-fill text-on-primary" : current ? "text-on-primary-container" : "text-on-surface-variant"}`} style={{fontVariationSettings: done ? "'FILL' 1" : "'FILL' 0"}}>
                      {STATUS_ICONS[step]}
                    </span>
                  </div>
                  <span className={`text-[10px] font-semibold ${done || current ? "text-primary" : "text-on-surface-variant opacity-50"}`}>{step}</span>
                </div>
                {i < STATUS_STEPS.length - 1 && (
                  <div className={`flex-1 h-0.5 mb-4 mx-1 transition-all duration-700 ${done ? "bg-primary" : "bg-surface-container-highest"}`} />
                )}
              </React.Fragment>
            );
          })}
        </div>
      </div>
    </div>
  );
};

const StatusPill = ({ status }) => {
  const styles = {
    Placed:    "bg-surface-container text-on-surface-variant",
    Preparing: "bg-primary-container text-on-primary-container",
    Served:    "bg-green-100 text-green-700",
  };
  return (
    <span className={`text-[11px] font-bold px-2.5 py-1 rounded-full flex items-center gap-1 ${styles[status]}`}>
      {status === "Preparing" && <div className="w-1.5 h-1.5 rounded-full bg-primary-container border border-primary animate-pulse" />}
      {status}
    </span>
  );
};

// ─── RECEIPT SCREEN ───────────────────────────────────────────────────────────
const ReceiptScreen = ({ navigate, rounds, sessionTotal }) => {
  const now = new Date().toLocaleDateString("en-AU", { weekday:"long", year:"numeric", month:"long", day:"numeric" });

  return (
    <div className="min-h-screen pb-28 fade-in">
      <TopBar title="Your Bill" showBack onBack={() => navigate("status")} />

      <div className="px-5 pt-6">
        {/* Header */}
        <div className="text-center mb-6">
          <div className="w-14 h-14 rounded-full bg-primary-container mx-auto flex items-center justify-center mb-3">
            <span className="ms ms-fill ms-lg text-on-primary-container">receipt_long</span>
          </div>
          <h2 className="font-serif text-2xl font-bold text-on-surface">Table {RESTAURANT.table}</h2>
          <p className="text-sm text-on-surface-variant">{now}</p>
        </div>

        {/* Receipt card */}
        <div className="bg-surface-container-lowest rounded-2xl shadow-sm px-5 py-5 mb-5">
          <div className="flex justify-between items-center mb-4 pb-3 border-b border-surface-container">
            <div>
              <p className="font-serif text-base font-semibold text-on-surface">Amber & Grain</p>
              <p className="text-xs text-on-surface-variant">{RESTAURANT.address}</p>
            </div>
            <div className="text-right">
              <p className="text-xs text-on-surface-variant">Order #</p>
              <p className="font-semibold text-sm text-on-surface">{1000 + rounds.length}</p>
            </div>
          </div>

          {rounds.map((round, ri) => (
            <div key={round.id} className="mb-4">
              <p className="text-[10px] font-bold uppercase tracking-widest text-on-surface-variant mb-2">{round.label}</p>
              {round.items.map((line, i) => (
                <div key={i} className="flex items-baseline justify-between py-0.5 gap-2">
                  <div className="flex-1 min-w-0">
                    <span className="text-sm text-on-surface">{line.qty}× {line.item.name}</span>
                    {line.note && <span className="text-xs text-on-surface-variant block italic">{line.note}</span>}
                  </div>
                  <span className="text-sm font-semibold">${(line.qty * line.item.price).toFixed(2)}</span>
                </div>
              ))}
              {ri < rounds.length - 1 && <div className="dashed-divider mt-3 text-on-surface" />}
            </div>
          ))}

          <div className="border-t border-surface-container pt-3 mt-2 space-y-1.5">
            <div className="flex justify-between text-sm text-on-surface-variant">
              <span>Subtotal</span><span>${sessionTotal.toFixed(2)}</span>
            </div>
            <div className="flex justify-between text-sm text-on-surface-variant">
              <span>GST (10%)</span><span>${(sessionTotal * 0.1).toFixed(2)}</span>
            </div>
            <div className="dashed-divider my-2 text-on-surface" />
            <div className="flex justify-between font-bold text-xl">
              <span className="font-serif text-on-surface">Total</span>
              <span className="text-primary">${(sessionTotal * 1.1).toFixed(2)}</span>
            </div>
          </div>
        </div>

        {/* Thank you */}
        <div className="text-center mb-6">
          <p className="font-serif text-lg text-on-surface mb-1">Thank you for visiting ✦</p>
          <p className="text-sm text-on-surface-variant">Your server will be with you shortly. You can also pay at the counter.</p>
        </div>

        {/* CTA */}
        <div className="space-y-3">
          <button className="w-full bg-primary text-on-primary font-bold py-4 rounded-full active:scale-[0.97] transition-transform flex items-center justify-center gap-2">
            <span className="ms ms-sm">payments</span>Request bill at table
          </button>
          <button className="w-full border border-outline-variant text-on-surface font-semibold py-3.5 rounded-full active:scale-[0.97] transition-transform text-sm">
            Split the bill
          </button>
        </div>

        <p className="text-center text-xs text-on-surface-variant mt-5 pb-2">Please retain this for your records</p>
      </div>
    </div>
  );
};

// ─── MOUNT ────────────────────────────────────────────────────────────────────
const root = createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
</html>
